name: Pages

# Publishes the engine bench to GitHub Pages (https://stenhoor.github.io/StoneMind/engine-bench/).
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test apps/engine-bench/test/*.test.mjs
      # v5 runs on Node 24. Unlike v3, it drops hidden files unless asked; the site needs its .nojekyll.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/engine-bench/dist/site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
