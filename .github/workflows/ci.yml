name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The WebGPU network on the golden positions, in headless Chromium (software adapter: correctness only).
      - run: npx -w @stonemind/engine-webgpu playwright install --with-deps chromium
      - run: npm run gpu-check -w @stonemind/engine-webgpu
