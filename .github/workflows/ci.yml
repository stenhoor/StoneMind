name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung browser test fails the run instead of holding it for GitHub's six hours. Each browser test also has its
    # own 60 s limit (the e2e scripts' --test-timeout).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # Which sub-projects this change affects (scripts/ci-affected.mjs): only their checks run. A change to shared
      # files (root package files, the TypeScript base config, .nvmrc, CI) runs everything; one only under docs/ or to
      # root Markdown runs nothing.
      - id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-affected.mjs "$BASE" HEAD
      - if: steps.affected.outputs.any == 'true'
        run: npm ci
      # Build everything first (seconds), so each affected package's checks find their dependencies built.
      - if: steps.affected.outputs.any == 'true'
        run: npm run build
      - if: steps.affected.outputs.any == 'true'
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}
        run: for p in $PACKAGES; do npm run check --if-present -w "$p" || exit 1; done
      # The WebGPU network on the golden positions, in headless Chromium (software adapter: correctness only). Only when
      # the engine's code, or something it depends on, changed.
      - if: steps.affected.outputs.gpu == 'true'
        run: npx -w @stonemind/engine-webgpu playwright install --with-deps chromium
      - if: steps.affected.outputs.gpu == 'true'
        run: npm run gpu-check -w @stonemind/engine-webgpu
      # Browser tests, in Chromium, Firefox and WebKit (Playwright's builds; WebKit is not Safari), for each affected
      # workspace that has an e2e script: only when it, or something it depends on, changed.
      - if: steps.affected.outputs.e2e != ''
        run: npx playwright install --with-deps chromium firefox webkit
      - if: steps.affected.outputs.e2e != ''
        env:
          BROWSERS: chromium,firefox,webkit
          E2E: ${{ steps.affected.outputs.e2e }}
        timeout-minutes: 15
        run: for p in $E2E; do npm run e2e -w "$p" || exit 1; done
