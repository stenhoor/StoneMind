<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoneMind Glass panel and bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../styles/components.css">
<script>
  try { const t = localStorage.getItem('stonemind.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  body { margin: 0; }
  .stage { min-height: 100vh; box-sizing: border-box; padding: var(--space-8); display: grid; place-items: center; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
</style>
</head>
<body class="sm-root">
<main class="stage sm-table">
  <div style="display: grid; gap: var(--space-5); width: min(460px, 100%)">
    <header class="sm-glass sm-bar">
      <img class="sm-logo-light" src="../../logos/wordmark.svg" alt="StoneMind" height="24"><img class="sm-logo-dark" src="../../logos/wordmark-on-dark.svg" alt="StoneMind" height="24">
      <span class="sm-secondary">Sample game · move 87</span>
    </header>
    <section class="sm-glass" aria-labelledby="coach-title" style="display: grid; gap: var(--space-4)">
      <h2 id="coach-title" class="h3" style="margin: 0">Coach</h2>
      <p class="body" style="margin: 0">You read the fight correctly, but your wall still had a cutting point.</p>
      <div class="sm-well">
        <div class="sm-label">Why this note</div>
        <p class="small" style="margin: 6px 0 0">Sample evidence from your recent games.</p>
      </div>
    </section>
  </div>
</main>
</body>
</html>
