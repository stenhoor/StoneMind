<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoneMind Segmented control: mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../styles/components.css">
<script>
  try { const t = localStorage.getItem('stonemind.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  body { margin: 0; }
  .stage { min-height: 100vh; box-sizing: border-box; padding: var(--space-8); display: grid; place-items: center; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
</style>
</head>
<body class="sm-root">
<main class="stage sm-table">
  <div class="sm-glass">
    <div class="sm-segmented" role="group" aria-label="Mode">
      <button type="button" aria-pressed="true">Review</button>
      <button type="button" aria-pressed="false">Study</button>
      <button type="button" aria-pressed="false">Goals</button>
    </div>
  </div>
</main>
</body>
</html>
