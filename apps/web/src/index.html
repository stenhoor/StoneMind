<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoneMind</title>
  <link rel="icon" href="brand/logos/favicon-32.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap">
  <link rel="stylesheet" href="brand/tokens.css">
  <link rel="stylesheet" href="brand/components.css">
  <link rel="stylesheet" href="app.css">
  <script>
    try {
      const t = localStorage.getItem('stonemind.theme'); if (t) document.documentElement.dataset.theme = t;
      const b = localStorage.getItem('stonemind.backdrop'); if (b) document.documentElement.dataset.backdrop = b;
    } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="sm-root">
  <div class="frame">
    <header class="frame-top">
      <sm-menu-bar></sm-menu-bar>

      <section id="bar-workspaces" class="sm-glass sm-bar frame-bar" aria-label="Workspaces" hidden>
        <p class="sm-secondary">No workspaces are open. Review, Play and Problems are not built yet.</p>
      </section>

      <section id="bar-layouts" class="sm-glass sm-bar frame-bar" aria-label="Layouts" hidden>
        <span id="layouts-profile" class="sm-chip"></span>
        <p class="sm-secondary">Layouts belong to a workspace, and none is open.</p>
      </section>

      <section id="bar-apps" class="sm-glass sm-bar frame-bar apps-bar" aria-label="Apps" hidden>
        <div class="apps-group" role="group" aria-labelledby="apps-panels">
          <span id="apps-panels" class="apps-group-label">Panels</span>
          <button type="button" class="app-tile" disabled>
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="17" r="2"/><path d="M7 6h3M14 6h3M12 8v5l5 3"/></svg></span>
            <span class="app-tile-name">Game tree</span>
          </button>
          <button type="button" class="app-tile" disabled>
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 15l5-5 4 3 7-8"/></svg></span>
            <span class="app-tile-name">Analysis</span>
          </button>
          <button type="button" class="app-tile" disabled>
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></span>
            <span class="app-tile-name">Notes</span>
          </button>
        </div>
        <div class="apps-group" role="group" aria-labelledby="apps-gobans">
          <span id="apps-gobans" class="apps-group-label">Gobans</span>
          <button type="button" class="app-tile" disabled>
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/><circle cx="15" cy="9" r="2.4" fill="currentColor"/></svg></span>
            <span class="app-tile-name">Review</span>
          </button>
          <button type="button" class="app-tile" disabled>
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="5" fill="currentColor"/><circle cx="16" cy="12" r="5"/></svg></span>
            <span class="app-tile-name">Play</span>
          </button>
          <button type="button" class="app-tile" disabled>
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h17M3 4v16"/><circle cx="8" cy="9" r="2.4" fill="currentColor"/><circle cx="13" cy="9" r="2.4"/><circle cx="8" cy="14" r="2.4"/><path d="M15 15l2 2 4-4"/></svg></span>
            <span class="app-tile-name">Problems</span>
          </button>
        </div>
        <div class="apps-group" role="group" aria-labelledby="apps-singletons">
          <span id="apps-singletons" class="apps-group-label">Apps</span>
          <button type="button" class="app-tile" data-singleton="files">
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            <span class="app-tile-name">Files</span>
          </button>
          <button type="button" class="app-tile" data-singleton="engines">
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/><rect x="10" y="10" width="4" height="4"/></svg></span>
            <span class="app-tile-name">Engines</span>
          </button>
          <button type="button" class="app-tile" data-singleton="layouts">
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M13 3v18M13 12h8"/></svg></span>
            <span class="app-tile-name">Layouts</span>
          </button>
          <button type="button" class="app-tile" data-singleton="settings">
            <span class="app-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>
            <span class="app-tile-name">Settings</span>
          </button>
        </div>
        <p class="sm-secondary apps-note">Panels and gobans are not built yet.</p>
      </section>
    </header>

    <main id="desk" class="desk">
      <p class="desk-empty sm-secondary">No workspace is open.</p>
      <div id="sheet-host" class="sheet-host" hidden></div>
    </main>
  </div>
</body>
</html>
